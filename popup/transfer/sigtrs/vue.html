<div class="reqpage">
    <pghead :adr="adr" :sadr="sadr" @swt="swtcuraddr"/>
    <div class="pgtitle">Transfer</div>


    <div class="reqbody">
        <div class="sitebar">
            <span class="sitechip"><b>{{dmu}}</b></span>
        </div>

        <div v-if="lding" class="ldw"><i class="spinner"></i></div>
        <div v-else>
            <div class="tx card" v-if="txdesc && txdesc.length">
                <label class="lbl">Transaction actions</label>
                <ul class="txd">
                    <li v-for="(v, i) in txdesc" :class="'l'+i" v-html="v"></li>
                </ul>
            </div>
            <p v-if="layouterr" class="layouterr">{{layouterr}}</p>

            <div v-if="txerr" class="txerr">
                <h1>Tx validation failed</h1>
                <p>{{txerr}}</p>
            </div>
        </div>

        <div v-show="!txerr&&!end" class="gas card" id="gasw">
            <swtgas ref="swtgas" />
        </div>
    </div>

    <div class="reqbtns" v-if="!end">
        <div><button class="cancel" @click="nop">Cancel</button></div>
        <div v-if="txres && txres.auditability && txres.auditability!='full'"><button class="mid" @click="openactv">All Actions</button></div>
        <div><button @click="cfim" :class="`blue ${txerr?'ban':''} ${ing?'ing':''}`">Commit Tx</button></div>
    </div>
    <div v-else class="success">
        <i class="icf" :class="ende?'show':''" style="--ic: url('../image/ftic/okg.svg')"></i>
        <p>The transaction has been successfully signed and submitted to the blockchain for confirmation</p>
    </div>

    <div class="wtip" v-if="!end">
        <p>Transactions are initiated by third-party services. Check every action before committing.</p>
    </div>
</div>
