<div class="reqpage">
    <pghead :adr="adr" :sadr="sadr"/>

    <div class="pgtitle">Network Switch</div>

    <div class="reqbody">
        <div class="sitebar">
            <span class="sitechip"><b>{{dmu}}</b></span>
        </div>

        <p class="lead">{{mode == 'add' ? 'This site wants to add a network:' : 'This site wants to switch network:'}}</p>

        <div class="card">
            <div class="row">
                <label>Current</label>
                <p>{{ctip(cur)}}</p>
            </div>
            <div class="row">
                <label>Target</label>
                <p>{{ctip(req)}}</p>
            </div>
            <div class="row">
                <label>ID</label>
                <p>{{req.id}}</p>
            </div>
            <div class="row">
                <label>RPC</label>
                <p class="mono">{{req.rpc}}</p>
            </div>
            <div class="row" v-if="req.explorer">
                <label>Explorer</label>
                <p class="mono">{{req.explorer}}</p>
            </div>
            <div class="row" v-if="req.remark">
                <label>Remark</label>
                <p>{{req.remark}}</p>
            </div>
        </div>

        <p class="warn" v-if="diff">A saved network with this ID already exists but uses different settings.</p>
        <p class="warn" v-if="err">{{err}}</p>
    </div>

    <div class="reqbtns">
        <div><button class="cancel" @click="nop">Cancel</button></div>
        <div v-if="diff && update == 'ask' && mode != 'add'">
            <button @click="switchOnly" :class="`${ing?'ing':''}`">Switch Only</button>
        </div>
        <div><button class="blue" @click="confirm" :class="`${ing?'ing':''}`">{{actionTitle()}}</button></div>
    </div>
</div>
