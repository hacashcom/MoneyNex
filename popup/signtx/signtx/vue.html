<div class="reqpage">
    <pghead :adr="adr" :sadr="sadr" @swt="swtcuraddr"/>
    <div class="pgtitle">Sign Transaction</div>


    <div class="reqbody">
        <div class="sitebar">
            <span class="sitechip"><b>{{dmu}}</b></span>
            <span class="netchip" v-if="chaintip">{{chaintip}}</span>
        </div>

        <div v-if="lding" class="ldw"><i class="spinner"></i></div>
        <div v-else>
            <div class="tx card" v-if="txdesc && txdesc.length">
                <label class="lbl">Transaction</label>
                <ul class="txd">
                    <li v-for="(v, i) in txdesc" :class="'l'+i" v-html="v"></li>
                </ul>
            </div>
            <p v-if="layouterr" class="layouterr">{{layouterr}}</p>

            <div v-if="txerr" class="txerr">
                <h1>Tx validation failed</h1>
                <p>{{txerr}}</p>
            </div>

            <div v-show="!txerr&&!end" class="sgck card">
                <label class="lbl">Signature status</label>
                <p class="sgr" v-for="(v, k) in txsgck">
                    <a>{{v.address.substr(0, 17)}}...</a>
                    <b v-if="v.complete" class="yes">Signed</b>
                    <b v-else class="no">Not yet</b>
                </p>
                <p class="actopen" v-if="txres && txres.review_binding">
                    <button class="mini" @click="openactv">Details</button>
                </p>
            </div>
        </div>
    </div>

    <div class="reqbtns" v-if="!end">
        <div><button class="cancel" @click="nop">Cancel</button></div>
        <div><button @click="cfim" :class="`blue ${txerr?'ban':''} ${ing?'ing':''}`">Sign Tx</button></div>
    </div>
    <div v-else class="success">
        <i class="icf" :class="ende?'show':''" style="--ic: url('../image/ftic/okg.svg')"></i>
        <p>Tx signed</p>
    </div>

    <div class="wtip" v-if="!end">
        <p>Third-party transaction. Review it carefully — a signature authorizes moving funds.</p>
    </div>
</div>
