; Hacash 单节点测试链配置（chain_id=1 测试链难度，mint init 初始发行）
; 用法：fullnode <path>/hacash.config.ini

[engine]
data_dir = ./data
fast_sync = false
show_miner_name = true

[p2p]
listen_ip = 127.0.0.1
listen_port = 13318
find_nodes = false
accept_nodes = false

[server]
enable = true
listen_ip = 127.0.0.1
listen_port = 8088
debug_routes = true

[mint]
chain_id = 1
diamond_form = true

[miner]
enable = true
reward = 1Drrsep4vZVKhKWx2vVmiw8umYN3ETYraB ; **专用挖矿收益地址**（与任何测试角色无关）。
;   为什么单独一个：早先收益发给测试主账户（1MzNY1oA…），而它同时是跨链资金路径的
;   用户账户 —— poworker 持续出块 ⇒ 余额每块都在涨，`余额增量 == 应得` 这类断言全被
;   出块奖励污染（只能退化成 ≥）。收益单独落一个没人用的地址后，主账户余额只受被测
;   行为影响。地址由种子派生：privkey = sha256("hacashbridge-miner-reward-test")，
;   该地址由专用测试种子派生；
;   该私钥不入库、不使用，收益视同销毁。
message = defi_sim_local

[vm]
log_enable = true
