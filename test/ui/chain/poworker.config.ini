; Hacash poworker（PoW 挖矿）配置，连接本地 fullnode（server 8088）
; 本地 testnet 必须用 hacash-testnet 的 testsleep 构建（默认 feature）：
;   cd hacash-testnet && cargo build -p hacash-testnet-poworker
; testsleep：1 线程，命中目标即停。块间隔由 hacash-chain.sh 以 `-sleep <秒>` 传入
; （HACASH_BLOCK_SEC，默认 1s = 每处 pause 0.5s；5 = 历史节奏）。全速版：--no-default-features
; 优先级：命令行 -sleep/-sleep-ms > 环境变量 HACASH_BLOCK_INTERVAL_MS > ini block_interval_sec > 5s
connect = 127.0.0.1:8088
supervene = 4
block_interval_sec = 1
